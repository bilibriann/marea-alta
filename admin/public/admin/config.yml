# Sveltia CMS — configuración de colecciones para Marea Alta.
#
# Este archivo vive en el proyecto `admin/` (deploy separado, protegido por
# proxy.ts) y NO en el repo del sitio público — ver admin/README.md.
# El backend de git apunta al repo donde vive el contenido real (src/content/).
backend:
  name: github
  repo: bilibriann/marea-alta
  branch: main
  # Proxy OAuth propio (admin/src/app/auth, admin/src/app/callback) — ver
  # "Migración al repo real" en admin/README.md. Este placeholder DEBE
  # reemplazarse por el dominio real del nuevo proyecto de Vercel antes de
  # desplegar — si se deja así, el login con GitHub falla de forma visible
  # en vez de apuntar silenciosamente al proyecto de pruebas equivocado.
  base_url: https://TODO-actualizar-dominio-vercel-repo-real

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "productos"
    label: "Productos"
    folder: "src/content/productos"
    create: true
    delete: true
    slug: "{{fields.nombre}}"
    format: "frontmatter"
    extension: "md"
    identifier_field: nombre
    # Las imágenes de cada producto caen en su propia carpeta en vez de
    # amontonarse en /images: la galería de un producto se revisa y se limpia
    # sin tocar la de los demás.
    media_folder: "/public/images/productos/{{slug}}"
    public_folder: "/images/productos/{{slug}}"
    fields:
      - { label: "Nombre", name: "nombre", widget: "string", required: true }
      - {
          label: "Subtítulo",
          name: "subtitulo",
          widget: "string",
          required: false,
          hint: "Ej: Trilaminado, Caja Display 4 Unidades",
        }
      - label: "Galería"
        name: "galeria"
        widget: "list"
        required: false
        field: { label: "Imagen", name: "imagen", widget: "image" }
      - label: "Grupos de Opciones"
        name: "grupos_opciones"
        widget: "list"
        required: false
        hint: "Deja vacío si el producto no tiene variantes (ej: Bobina Hidromax). Cada grupo es una categoría libre (Formatos, Empaque, etc.) con sus propias opciones."
        fields:
          - {
              label: "Título del Grupo",
              name: "titulo_grupo",
              widget: "string",
              hint: "Ej: Formatos, Empaque",
            }
          - label: "Opciones"
            name: "opciones"
            widget: "list"
            field: { label: "Opción", name: "opcion", widget: "string" }
      - {
          label: "Nota Adicional",
          name: "nota_adicional",
          widget: "text",
          required: false,
        }
      - label: "Cantidades para Cotizar"
        name: "opciones_cantidad"
        widget: "list"
        required: false
        hint: "Cantidades disponibles para cotizar este producto (ej: 50, 100, 1000)"
        field: { label: "Cantidad", name: "cantidad", widget: "string" }
      - label: "Fichas Comerciales (PDF)"
        name: "fichas"
        widget: "list"
        required: false
        hint: "Un producto puede tener más de una ficha (por formato o por envase). Si lo dejas vacío, el botón de descarga no aparece."
        fields:
          - {
              label: "Archivo PDF",
              name: "archivo",
              widget: "file",
              required: true,
              media_folder: "/public/fichas",
              public_folder: "/fichas",
            }
          - {
              label: "Etiqueta",
              name: "etiqueta",
              widget: "string",
              required: false,
              hint: "Solo si el producto tiene varias fichas, para distinguirlas (ej: 20x28 cm, Envase metalizado).",
            }
      - {
          label: "Video de YouTube",
          name: "video_youtube",
          widget: "string",
          required: false,
          hint: "URL completa del video (ej: https://www.youtube.com/watch?v=...). Déjalo vacío si el producto no tiene video.",
        }

  - name: "noticias"
    label: "Noticias"
    folder: "src/content/noticias"
    create: true
    delete: true
    slug: "{{fields.titulo}}"
    format: "frontmatter"
    extension: "md"
    identifier_field: titulo
    sortable_fields: ["fecha", "titulo"]
    view_filters:
      - { label: "Recientes primero", field: "fecha", pattern: ".*" }
    fields:
      - { label: "Título", name: "titulo", widget: "string", required: true }
      - {
          label: "Imagen Destacada",
          name: "imagen_destacada",
          widget: "image",
          required: true,
        }
      - {
          label: "Fecha",
          name: "fecha",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
          required: true,
        }
      - {
          label: "Extracto",
          name: "extracto",
          widget: "text",
          required: true,
          hint: "Resumen corto para el listado de noticias",
        }
      - {
          label: "Contenido",
          name: "body",
          widget: "markdown",
          required: true,
        }
