# Verificación en cada push y PR. No despliega nada: solo confirma que el
# proyecto compila, tipa y pasa lint antes de que algo llegue a producción.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npx tsc --noEmit

      # Build sin GITHUB_PAGES: el mismo que se sube a Hostinger.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FORMS_ENDPOINT: ${{ vars.FORMS_ENDPOINT || 'https://api.web3forms.com/submit' }}
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}

      - name: Verificar export
        run: npm run check:export
